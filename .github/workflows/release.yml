name: Build and Release

# 當推送 v 開頭的標籤（例如 v1.0.0）時觸發
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 允許建立 Release

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build StillGuard.exe
        shell: cmd
        run: call build.bat

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item StillGuard.exe dist\
          Copy-Item README.md dist\
          Copy-Item config.example.json dist\
          Compress-Archive -Path dist\* -DestinationPath "StillGuard-${{ github.ref_name }}.zip" -Force

      - name: Generate release notes from CHANGELOG
        shell: pwsh
        run: pwsh -File scripts/extract-changelog.ps1 -Tag "${{ github.ref_name }}"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "StillGuard.exe"
          "StillGuard-${{ github.ref_name }}.zip"
          --title "StillGuard ${{ github.ref_name }}"
          --notes-file release-body.md
